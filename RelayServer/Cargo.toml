[package]
name = "relay-server"
version = "1.0.0"
edition = "2021"
description = "Self-hosted rendezvous and relay server for remote desktop clients"
license = "AGPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = "2"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
protobuf = { version = "3.7", features = ["with-bytes"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }

[build-dependencies]
protobuf-codegen = "3.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
